<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F1F5F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Seafarer Calc" />
    
    <title>Seafarer NRI & Seatime Calculator</title>
    
    <!-- Fonts Preconnect & Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
  </head>
  <body>
    <div id="root">
      <style>
        :root {
          --load-bg: #F1F5F9;
          --load-text-title: #0f172a;
          --load-text-sub: #64748b;
          --load-bar-bg: #1e293b;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --load-bg: #020617;
            --load-text-title: #f8fafc;
            --load-text-sub: #94a3b8;
            --load-bar-bg: #334155;
          }
        }
        .load-container {
          min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background-color: var(--load-bg);
        }
        .load-title { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; color: var(--load-text-title); line-height: 1.2; }
        .load-sub { font-size: 12px; color: var(--load-text-sub); }
        .load-bar { width: 140px; height: 3px; background: var(--load-bar-bg); border-radius: 9999px; overflow: hidden; position: relative; }
        @keyframes loadPulse {
          0% { left: -50%; width: 30%; }
          50% { left: 35%; width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
      <div class="load-container">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <div style="width: 44px; height: 44px; background: #10B981; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
          </div>
          <div>
            <div class="load-title">Seafarer Calc</div>
            <div class="load-sub">NRI &amp; Seatime Tracker</div>
          </div>
        </div>
        <div class="load-bar">
          <div style="width: 50%; height: 100%; background: #10B981; border-radius: 9999px; position: absolute; animation: loadPulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
